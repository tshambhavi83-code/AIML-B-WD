<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function constructor in js </title>
</head>
<body>
    <script>

        function student (name, rollnumber , pincode, city)
        {
            this.name= name;
            this.rollnumber=rollnumber;
            this.pincode=pincode;
            this.city=city;
        }

        let s1= new student("shambhavi", 179, 201008, "prayagraj");
        let s2= new student("krishn" , 180, 201008, "vrindavan");
        let s3 = new  student("radha", 181, 201008, "barsana");

        this.display=function()
        {
            console.log(this.name);
        }

        console.log(s1);
        console.log(s2);
        console.log(s3);
    </script>
    
</body>
</html>
