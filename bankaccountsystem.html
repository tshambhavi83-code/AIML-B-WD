<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank account management system</title>
</head>
<script>

    let account = {
        accountholdername:"shambhavi tripathi",
        accountnumber:"2503215300179",
        accountbalance:5000,

        deposit : function(amount) {
            this.accountbalance+= amount;
            document.write("deposited: " + amount);
        },

        withdraw : function(amount) {
            if(amount > this.accountbalance)
        {
            document.write("insufficient balance");

        }
        else 
        {
            this.accountbalance-= amount;
            document.write("withdraw: " + amount);
        }

        },

        display : function () {
            document.write("current balance: " + this.accountbalance);
        }

    };

    account.display();

    account.deposit(2000);

    account.withdraw(3000);

    account.display();

    account.withdraw(9000);

    account.display();
</script>

</html>
